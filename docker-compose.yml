services:
  kafka:
    image: apache/kafka:4.2.0
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.2.0
    depends_on:
      kafka: 
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:29092
        --create
        --if-not-exists
        --topic market.trades.raw.v1
        --partitions 1
        --replication-factor 1
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin
        && mc mb --ignore-existing local/crypto-data
    restart: "no"

  collector:
    build: .
    environment:
      COLLECTOR_EXCHANGE: ${COLLECTOR_EXCHANGE:-coinbase}
      COLLECTOR_WEBSOCKET_URL: ${COLLECTOR_WEBSOCKET_URL:-wss://advanced-trade-ws.coinbase.com}
      COLLECTOR_SYMBOLS: '${COLLECTOR_SYMBOLS:-["BTC-USD","ETH-USD"]}'
      COLLECTOR_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  raw-sink:
    build: ./jobs/spark
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --conf
      - spark.jars.ivy=/opt/spark/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.8,org.apache.hadoop:hadoop-aws:3.3.4
      - /opt/spark/work-dir/jobs/spark/entrypoints/raw_market_trades.py
    environment:
      PYTHONPATH: /opt/spark/work-dir
      RAW_SINK_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RAW_SINK_KAFKA_TOPIC: market.trades.raw.v1
      RAW_SINK_OUTPUT_PATH: s3a://crypto-data/raw/market_trade_raw/v1
      RAW_SINK_CHECKPOINT_PATH: s3a://crypto-data/checkpoints/raw-market-trades-v1
      RAW_SINK_S3_ENDPOINT: http://minio:9000
      RAW_SINK_S3_ACCESS_KEY: minioadmin
      RAW_SINK_S3_SECRET_KEY: minioadmin
      RAW_SINK_TRIGGER_INTERVAL: 10 seconds
    volumes:
      - spark-ivy-cache:/opt/spark/.ivy2
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - jps -l | grep -q org.apache.spark.deploy.SparkSubmit
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  kafka-data:
  minio-data:
  spark-ivy-cache:
