[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crypto-trading-collector"
version = "0.1.0"
description = "Public crypto market-trade WebSocket collector"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.3,<4",
    "crypto-exchange-adapters",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4,<5",
    "mypy>=1,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.6,<1",
]

[project.scripts]
crypto-collector = "crypto_trading_collector.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_trading_collector"]

[tool.uv.sources]
crypto-exchange-adapters = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["../../tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
