[tool.uv.workspace]
members = [
    "apps/collector",
    "apps/historical_backfill",
    "apps/operator_dashboard",
    "apps/trading_core",
    "packages/domain",
    "packages/exchange_adapters",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26,<5",
    "mypy>=1.20,<2",
    "pyspark==3.5.8",
    "pytest-asyncio>=1.4,<2",
    "pytest>=8.4,<9",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the local Podman Compose stack",
]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pyspark", "pyspark.*"]
ignore_missing_imports = true
