name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install uv
        run: python -m pip install uv==0.12.3
      - name: Create locked environment
        run: uv sync --python 3.11 --all-packages --all-groups --locked
      - name: Lint
        run: uv run ruff check apps jobs packages tests
      - name: Type check trading core
        run: uv run mypy -p crypto_trading_core
      - name: Test
        run: uv run python -m pytest -q
